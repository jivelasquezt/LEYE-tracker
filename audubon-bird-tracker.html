<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesser Yellowlegs Migration Tracker — National Audubon Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,300&display=swap" rel="stylesheet">

  function trackLoadData(f,t){gtag('event','load_data',{date_from:f,date_to:t});}

<style>
/* ── AUDUBON EXPLORER DESIGN SYSTEM ── */
:root {
  --white:      #ffffff;
  --off-white:  #fafaf8;
  --nav-bg:     #ffffff;
  --sidebar-bg: #ffffff;
  --map-bg:     #1a2330;
  --blue:       #1d6fad;
  --blue-dark:  #155a8f;
  --blue-light: #e8f2fb;
  --orange:     #e05b24;
  --orange-dark:#c44d1c;
  --tracked:    #1d6fad;
  --text:       #1a1a1a;
  --text-mid:   #4b5563;
  --text-muted: #9ca3af;
  --border:     #e5e7eb;
  --shadow-sm:  0 1px 2px rgba(0,0,0,.06);
  --shadow-md:  0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(0,0,0,.12);
  --sidebar-w:  320px;
  --nav-h:      56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 14px;
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--map-bg);
}

/* ── TOP NAVIGATION ── */
nav {
  height: var(--nav-h);
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 0;
  flex-shrink: 0;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: 24px;
  flex-shrink: 0;
  text-decoration: none;
}

.nav-logo img.audubon-logo {
  height: 32px;
  width: auto;
  /* The logo is white - invert for light background */
  filter: invert(1) brightness(0);
}

.nav-logo img.bird-thumb {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 20%;
  border: 1.5px solid var(--border);
}

.nav-divider {
  width: 1px;
  height: 28px;
  background: var(--border);
  margin: 0 16px;
  flex-shrink: 0;
}

.nav-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.nav-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  white-space: nowrap;
}

.nav-date-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 24px;
}

.nav-date-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.nav-date-input {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--text);
  background: var(--off-white);
  outline: none;
  transition: border-color .15s;
}
.nav-date-input:focus { border-color: var(--blue); background: white; }

.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-load {
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 7px 18px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
  letter-spacing: .01em;
}
.btn-load:hover { background: var(--orange-dark); }
.btn-load.loading { background: var(--text-muted); cursor: not-allowed; }

.nav-status {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted); flex-shrink: 0;
}
.status-dot.ok   { background: #22c55e; }
.status-dot.warn { background: #f59e0b; }
.status-dot.err  { background: #ef4444; }
.status-label {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ── MAIN LAYOUT ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  z-index: 100;
}

.sidebar-top {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 2px;
}

.sidebar-heading {
  font-family: 'Merriweather', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
}

.sidebar-sub {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 2px;
}

.bird-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: var(--off-white);
}

/* Bird card — matches Audubon Explorer species card style */
.bird-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0;
  margin-bottom: 8px;
  cursor: pointer;
  transition: box-shadow .15s, transform .15s;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.bird-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.bird-card.active {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(29,111,173,.15), var(--shadow-md);
}

.bird-card.no-data {
  opacity: .55;
  cursor: default;
}
.bird-card.no-data:hover {
  transform: none;
  box-shadow: var(--shadow-sm);
}

.bird-card-color-bar {
  height: 4px;
  width: 100%;
  background: var(--bird-color, var(--border));
}

.bird-card-body {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
}

.bird-card-icon {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  object-fit: cover;
  object-position: center 20%;
  flex-shrink: 0;
  background: var(--off-white);
  border: 1px solid var(--border);
}

.bird-card-info { flex: 1; min-width: 0; }

.bird-card-tracked {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tracked);
  margin-bottom: 3px;
}

.bird-card-tracked::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--bird-color, var(--tracked));
  flex-shrink: 0;
}

.bird-card-tracked.no-signal {
  color: var(--text-muted);
}
.bird-card-tracked.no-signal::before { background: var(--text-muted); }

.bird-card-name {
  font-family: 'Merriweather', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bird-card-location {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bird-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 14px 10px;
  border-top: 1px solid var(--border);
  background: var(--off-white);
}

.bird-card-date {
  font-size: 10px;
  color: var(--text-muted);
}

.bird-card-pts {
  font-size: 10px;
  font-weight: 600;
  color: var(--bird-color, var(--text-muted));
  font-variant-numeric: tabular-nums;
}

/* ── MAP AREA ── */
.map-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

#map { flex: 1; background: var(--map-bg); }

/* ── STATS PANEL ── */
.stats-panel {
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  box-shadow: 0 -2px 8px rgba(0,0,0,.06);
}

.stats-empty {
  padding: 16px 20px;
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
  text-align: center;
}

.stats-content { display: none; flex-direction: column; }
.stats-content.visible { display: flex; }

.stats-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px 8px;
  border-bottom: 1px solid var(--border);
}

.stats-name {
  font-family: 'Merriweather', serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}

.stats-period {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.stats-grid {
  display: flex;
  overflow-x: auto;
}

.stat-cell {
  flex: 1;
  min-width: 120px;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }

.stat-key {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-val {
  font-family: 'Merriweather', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  line-height: 1;
  white-space: nowrap;
}

.stat-unit {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  margin-left: 2px;
}

.stat-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── MAP OVERLAYS ── */
.map-legend {
  position: absolute;
  bottom: 32px;
  right: 12px;
  z-index: 500;
  background: rgba(20,30,45,.88);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  padding: 10px 14px;
  backdrop-filter: blur(6px);
}

.legend-title {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  margin-bottom: 6px;
}

.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.legend-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-lbl  { font-size: 11px; color: rgba(255,255,255,.75); }

/* ── LOADING ── */
.loading-overlay {
  display: none;
  position: absolute; inset: 0;
  background: rgba(20,30,45,.7);
  z-index: 900;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  backdrop-filter: blur(3px);
}
.loading-overlay.visible { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.loading-text {
  font-size: 13px;
  color: rgba(255,255,255,.7);
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #1a2330; color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  z-index: 9999; transition: transform .25s;
  pointer-events: none;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,.1);
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── LEAFLET OVERRIDES ── */
.leaflet-popup-content-wrapper {
  background: rgba(20,30,45,.95) !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  border-radius: 10px !important;
  color: rgba(255,255,255,.9) !important;
  box-shadow: var(--shadow-lg) !important;
}
.leaflet-popup-tip { background: rgba(20,30,45,.95) !important; }
.leaflet-popup-content { margin: 12px 16px !important; font-size: 12px; line-height: 1.6; }
.leaflet-popup-content b { color: #fff; }
.leaflet-popup-close-button { color: rgba(255,255,255,.5) !important; top: 4px !important; right: 6px !important; }
.leaflet-control-attribution { background: rgba(20,30,45,.7) !important; color: rgba(255,255,255,.4) !important; font-size: 9px !important; border-radius: 4px 0 0 0 !important; }
.leaflet-control-attribution a { color: rgba(255,255,255,.4) !important; }
.leaflet-bar a { background: rgba(20,30,45,.9) !important; color: rgba(255,255,255,.85) !important; border-color: rgba(255,255,255,.1) !important; }
.leaflet-bar a:hover { background: rgba(40,55,75,.95) !important; }
.leaflet-control-layers {
  background: rgba(20,30,45,.92) !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  border-radius: 8px !important;
  color: rgba(255,255,255,.8) !important;
}
.leaflet-control-layers-base label { color: rgba(255,255,255,.8) !important; font-size: 12px !important; }
.leaflet-control-layers-separator { border-top-color: rgba(255,255,255,.1) !important; }

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 768px) {
  :root { --nav-h: auto; --sidebar-w: 100%; }
  body { overflow: auto; height: auto; min-height: 100vh; }
  nav {
    flex-wrap: wrap;
    height: auto;
    padding: 10px 14px;
    gap: 8px;
  }
  .nav-logo img.audubon-logo { height: 24px; }
  .nav-logo img.bird-thumb { width: 28px; height: 28px; }
  .nav-title { font-size: 11px; }
  .nav-subtitle { display: none; }
  .nav-date-controls {
    margin-left: 0;
    width: 100%;
    gap: 6px;
  }
  .nav-date-label { display: none; }
  .nav-date-input { flex: 1; font-size: 12px; }
  .nav-right { margin-left: 0; width: 100%; justify-content: space-between; }
  .nav-status { display: none; }
  .main { flex-direction: column; overflow: auto; height: auto; }
  .sidebar {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .bird-list {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px;
    gap: 8px;
  }
  .bird-card {
    min-width: 200px;
    flex-shrink: 0;
    margin-bottom: 0;
  }
  .map-wrap { height: 50vh; flex: none; }
  #map { height: 100%; }
  .stats-grid { flex-direction: column; }
  .stat-cell { border-right: none; border-bottom: 1px solid var(--border); min-width: unset; }
  .stat-cell:last-child { border-bottom: none; }
  .map-legend { display: none; }
  .nav-divider { display: none; }
}

@media (max-width: 480px) {
  .nav-logo > div { display: none; }
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

  const now  = new Date();

  document.getElementById('dateTo').value   = now.toISOString().split('T')[0];
  document.getElementById('dateFrom').value = past.toISOString().split('T')[0];
}

// ─────────────────────────────────────

function init() {
  initDates();
  map = L.map('map', { zoomControl:true }).setView([3.19, -76.54], 11);

  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Tiles © Esri', maxZoom:19 }
  );
  const labels = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { maxZoom:19 }
  );
  const topo = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Tiles © Esri', maxZoom:19 }
  );
  const dark = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Tiles © Esri', maxZoom:16 }
  );

  const hybrid = L.layerGroup([satellite, labels]).addTo(map);
  L.control.layers(
    {'🛰 Satellite + Labels': hybrid, '🌑 Dark': dark, '🗺 Topo': topo},
    {}, {position:'bottomleft'}

  trackLayer  = L.layerGroup().addTo(map);
  markerLayer = L.layerGroup().addTo(map);

  checkBackend();
  setInterval(checkBackend, 30000);
  renderSidebar();
}

// ─────────────────────────────────────
// GEOCODE
// ─────────────────────────────────────
async function reverseGeocode(lat, lon) {
  try {
    const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=8`, {headers:{'Accept-Language':'en'}});
    const data = await res.json();
    const a    = data.address || {};
    if (data.type==='sea'||data.type==='ocean'||a.body_of_water) return data.name||a.body_of_water||'Open Ocean';
    const adm2 = a.county||a.municipality||a.city_district||a.state_district;
    const adm1 = a.state||a.region;
    const cc   = a.country_code?.toUpperCase();
    if (adm2&&adm1) return `${adm2}, ${adm1}`;
    if (adm2) return adm2;
    if (adm1) return `${adm1}, ${cc}`;
    return data.display_name?.split(',').slice(0,2).join(',').trim()||'—';
  } catch(e) { return '—'; }
}

// ─────────────────────────────────────
// SELECT BIRD
// ─────────────────────────────────────
function selectBird(bird) {
  if (typeof trackBirdSelect==='function') trackBirdSelect(bird.name);
  activeBird = bird;
  trackLayer.clearLayers();
  markerLayer.clearLayers();
  renderSidebar();
  drawTrack(bird);
  renderStats(bird);
}

// ─────────────────────────────────────
// DRAW TRACK
// ─────────────────────────────────────
function drawTrack(bird) {
  const pts = (birdData[bird.deviceUid]||[])
    .filter(p=>p.lat&&p.lon)
    .sort((a,b)=>a.dt.localeCompare(b.dt));
  if (!pts.length) return;

  L.polyline(pts.map(p=>[p.lat,p.lon]), {
    color: bird.color, weight: 2, opacity: .65, dashArray: '5 8'
  }).addTo(trackLayer);

  pts.forEach((pt,i) => {
    const isLast = i===pts.length-1;
    const color  = classColor(pt.cls);
    const m = L.circleMarker([pt.lat,pt.lon], {
      radius: isLast?10:6,
      fillColor: color,
      color: isLast?'#fff':bird.color,
      weight: isLast?2.5:1,
      fillOpacity: isLast?1:.8,
    }).addTo(markerLayer);

    m.bindTooltip(`
      <b>${pt.dt.replace('T',' ').slice(0,16)} UTC</b><br>
      ${pt.lat.toFixed(5)}°N &nbsp; ${Math.abs(pt.lon).toFixed(5)}°W<br>
      Alt: <b>${pt.alt}m</b> &nbsp; Err: ±${pt.err}m &nbsp; Class ${pt.cls}<br>
      Sat: ${pt.sat}
    `, {direction:'top', offset:[0,-5]});

    m.on('click', () => showPointPopup(pt, bird));
  });

  map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])).pad(.25));
}

function classColor(cls) {
  if (['A','1','2','3'].includes(String(cls))) return '#4ade80';
  if (cls==='B') return '#fbbf24';
  return '#94a3b8';
}

function showPointPopup(pt, bird) {
  L.popup()
    .setLatLng([pt.lat, pt.lon])
    .setContent(`
      <b style="font-size:13px">${bird.name}</b><br>
      <span style="color:rgba(255,255,255,.5)">${pt.dt.replace('T',' ').slice(0,16)} UTC</span><br><br>
      <b>${pt.lat.toFixed(5)}° N &nbsp; ${Math.abs(pt.lon).toFixed(5)}° W</b><br>
      Altitude: ${pt.alt} m<br>
      Accuracy: Class ${pt.cls} ±${pt.err}m<br>
      Satellite: ${pt.sat}
    `)
    .openOn(map);
}

// ─────────────────────────────────────
// FLIGHT STATS
// ─────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearing(lat1,lon1,lat2,lon2) {
  const dLon=(lon2-lon1)*Math.PI/180;
  const y=Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
  const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

function bearingLabel(deg) {
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5)%16];
}

function renderStats(bird) {
  const pts = (birdData[bird.deviceUid]||[]).sort((a,b)=>a.dt.localeCompare(b.dt));
  document.getElementById('statsEmpty').style.display = 'none';
  const sc = document.getElementById('statsContent');
  sc.classList.add('visible');
  document.getElementById('statsBirdName').textContent = bird.name+' · '+bird.deviceRef;

  if (pts.length<2) {
    document.getElementById('statsPeriod').textContent = 'Insufficient data';
    document.getElementById('statsGrid').innerHTML = '<div class="stat-cell" style="color:var(--text-muted);font-style:italic">Not enough fixes to compute stats.</div>';
    return;
  }

  const first=pts[0], last=pts[pts.length-1];
  const durH=(new Date(last.dt+'Z')-new Date(first.dt+'Z'))/3600000;
  const durStr=durH<24?`${Math.floor(durH)}h ${Math.round((durH%1)*60)}m`:`${(durH/24).toFixed(1)} days`;
  let cumDist=0;
  for(let i=1;i<pts.length;i++) cumDist+=haversine(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
  const straightDist=haversine(first.lat,first.lon,last.lat,last.lon);
  const avgSpeed=durH>0?cumDist/durH:0;
  const deg=bearing(first.lat,first.lon,last.lat,last.lon);

  document.getElementById('statsPeriod').textContent = `${fmtDate(first.dt)} → ${fmtDate(last.dt)}`;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-cell">
      <div class="stat-key">Duration</div>
      <div class="stat-val">${durStr}</div>
      <div class="stat-sub">${pts.length} position fixes</div>
    </div>
    <div class="stat-cell">
      <div class="stat-key">Path Distance</div>
      <div class="stat-val">${cumDist.toFixed(1)}<span class="stat-unit">km</span></div>
      <div class="stat-sub">Cumulative along track</div>
    </div>
    <div class="stat-cell">
      <div class="stat-key">Displacement</div>
      <div class="stat-val">${straightDist.toFixed(1)}<span class="stat-unit">km</span></div>
      <div class="stat-sub">Start → latest fix</div>
    </div>
    <div class="stat-cell">
      <div class="stat-key">Avg Speed</div>
      <div class="stat-val">${avgSpeed.toFixed(1)}<span class="stat-unit">km/h</span></div>
      <div class="stat-sub">${(avgSpeed*.621371).toFixed(1)} mph</div>
    </div>
    <div class="stat-cell">
      <div class="stat-key">Direction</div>
      <div class="stat-val">${bearingLabel(deg)}</div>
      <div class="stat-sub">${deg.toFixed(0)}° bearing</div>
    </div>`;
}

// ─────────────────────────────────────
// LOAD DATA
// ─────────────────────────────────────
async function loadAllBirds() {
  const from = document.getElementById('dateFrom').value+'T00:00:00.000Z';
  const to   = document.getElementById('dateTo').value  +'T23:59:59.000Z';
  if (typeof trackLoadData==='function') trackLoadData(from,to);
  setLoading(true,'Fetching tracks from CLS API…');
  document.getElementById('btnLoad').classList.add('loading');

  try {
    const res  = await fetch(`${API_BASE}/api/tracks?from=${from}&to=${to}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error||'Load failed');
    let loaded=0;
    for(const track of (data.devices||[])) {
      if(track.points?.length){ birdData[track.deviceUid]=track.points; loaded++; }
    }
    toast(`Loaded ${loaded} of ${BIRDS.length} birds`);
    setLoading(true,'Identifying locations…');
    await geocodeAll();
  } catch(e) {
    toast('Error: '+e.message);
    console.error(e);
  }

  setLoading(false);
  document.getElementById('btnLoad').classList.remove('loading');
  renderSidebar();
  const first=BIRDS.find(b=>(birdData[b.deviceUid]||[]).length>0);
  if(first) selectBird(first);
}

async function geocodeAll() {
  for(const bird of BIRDS) {
    const pts=birdData[bird.deviceUid];
    if(!pts?.length) continue;
    const last=[...pts].sort((a,b)=>b.dt.localeCompare(a.dt))[0];
    birdLocation[bird.deviceUid]=await reverseGeocode(last.lat,last.lon);
    renderSidebar();
  }
}

// ─────────────────────────────────────
// BACKEND
// ─────────────────────────────────────
async function checkBackend() {
  try {
    const res=await fetch(`${API_BASE}/health`);
    const data=await res.json();
    const dot=document.getElementById('statusDot');
    const txt=document.getElementById('statusText');
    if(data.status==='ok'&&data.tokenValid){
      dot.className='status-dot ok';
      txt.textContent=`Connected · ${data.tokenExpiresIn}s`;
    } else {
      dot.className='status-dot warn';
      txt.textContent='Connected · refreshing…';
    }
  } catch(e) {
    document.getElementById('statusDot').className='status-dot err';
    document.getElementById('statusText').textContent='Backend offline';
  }
}

// ─────────────────────────────────────
// HELPERS
// ─────────────────────────────────────
function fmtDate(dt) {
  return new Date(dt+(dt.endsWith('Z')?'':'Z'))
    .toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function setLoading(v,msg='') {
  document.getElementById('loadingOverlay').classList.toggle('visible',v);
  if(msg) document.getElementById('loadingText').textContent=msg;
}

let toastTimer;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}

// ─────────────────────────────────────
// START
// ─────────────────────────────────────
init();
checkBackend();
setInterval(checkBackend,30000);
</script>
