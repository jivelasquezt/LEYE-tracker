<style>
:root {
  --white:#fff; --off-white:#fafaf8;
  --blue:#1d6fad; --orange:#e05b24; --orange-dk:#c44d1c;
  --text:#1a1a1a; --muted:#6b7280; --border:#e5e7eb;
  --map-bg:#1a2330;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --sidebar-w:320px; --nav-h:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--map-bg);}

/* NAV */
nav{height:var(--nav-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:1000;box-shadow:var(--shadow-sm);}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.audubon-logo{height:30px;width:auto;display:block;}
.bird-thumb{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:center 20%;border:1.5px solid var(--border);flex-shrink:0;}
.nav-sep{width:1px;height:26px;background:var(--border);flex-shrink:0;}
.nav-title-wrap{line-height:1.25;}
.nav-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;}
.nav-subtitle{font-size:10px;color:var(--muted);font-style:italic;white-space:nowrap;}
.nav-controls{display:flex;align-items:center;gap:8px;margin-left:auto;}
.date-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.date-in{border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);background:var(--off-white);outline:none;}
.date-in:focus{border-color:var(--blue);background:var(--white);}
.btn-load{background:var(--orange);color:var(--white);border:none;border-radius:20px;padding:7px 16px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;}
.btn-load:hover{background:var(--orange-dk);}
.btn-load.loading{background:var(--muted);cursor:not-allowed;}
.nav-status{display:flex;align-items:center;gap:5px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.sdot.ok{background:#22c55e;} .sdot.warn{background:#f59e0b;} .sdot.err{background:#ef4444;}
.slbl{font-size:10px;color:var(--muted);white-space:nowrap;}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;min-height:0;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.sidebar-top{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.s-eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:2px;}
.s-heading{font-family:'Merriweather',serif;font-size:16px;font-weight:700;line-height:1.2;}
.s-sub{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px;}
.bird-list{flex:1;overflow-y:auto;padding:8px;background:var(--off-white);}

/* BIRD CARD */
.bird-card{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,transform .15s;overflow:hidden;box-shadow:var(--shadow-sm);position:relative;}
.bird-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.bird-card.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,111,173,.15),var(--shadow-md);}
.bird-card.no-data{opacity:.5;cursor:default;}
.bird-card.no-data:hover{transform:none;box-shadow:var(--shadow-sm);}
.card-bar{height:4px;background:var(--bird-color,var(--border));}
.card-body{display:flex;align-items:center;gap:12px;padding:11px 13px;}
.card-icon{width:50px;height:50px;border-radius:8px;object-fit:cover;object-position:center 20%;flex-shrink:0;border:1px solid var(--border);background:var(--off-white);}
.card-info{flex:1;min-width:0;}
.card-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:2px;}
.card-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--bird-color,var(--blue));flex-shrink:0;}
.card-badge.nosig{color:var(--muted);}
.card-badge.nosig::before{background:var(--muted);}
.card-name{font-family:'Merriweather',serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-loc{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;justify-content:space-between;align-items:center;padding:6px 13px 9px;border-top:1px solid var(--border);background:var(--off-white);}
.card-date{font-size:10px;color:var(--muted);}
.card-pts{font-size:10px;font-weight:600;color:var(--bird-color,var(--muted));}

/* MAP */
.map-wrap{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0;}
#map{flex:1;background:var(--map-bg);min-height:0;}

/* LEGEND */
.map-legend{position:absolute;top:12px;right:12px;z-index:500;background:rgba(20,30,45,.88);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 13px;backdrop-filter:blur(6px);}
.leg-title{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:5px;}
.leg-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.leg-lbl{font-size:11px;color:rgba(255,255,255,.7);}

/* LOADING */
.loading-ov{display:none;position:absolute;inset:0;background:rgba(20,30,45,.75);z-index:900;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(3px);}
.loading-ov.visible{display:flex;}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;}
.loading-txt{font-size:13px;font-weight:500;color:rgba(255,255,255,.7);}
@keyframes spin{to{transform:rotate(360deg);}}

/* STATS PANEL */
.stats-panel{background:var(--white);border-top:1px solid var(--border);flex-shrink:0;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.stats-empty{padding:14px 20px;font-size:13px;color:var(--muted);font-style:italic;text-align:center;}
.stats-inner{display:none;flex-direction:column;}
.stats-inner.on{display:flex;}
.stats-head{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 7px;border-bottom:1px solid var(--border);}
.stats-name{font-family:'Merriweather',serif;font-size:13px;font-weight:700;}
.stats-period{font-size:11px;color:var(--muted);}
.stats-grid{display:flex;overflow-x:auto;}
.sc{flex:1;min-width:110px;padding:9px 14px;border-right:1px solid var(--border);}
.sc:last-child{border-right:none;}
.sk{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.sv{font-family:'Merriweather',serif;font-size:20px;font-weight:400;color:var(--text);line-height:1;white-space:nowrap;}
.su{font-size:11px;color:var(--muted);margin-left:2px;}
.ss{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a2330;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;transition:transform .25s;pointer-events:none;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.1);}
#toast.show{transform:translateX(-50%) translateY(0);}

/* LEAFLET */
.leaflet-popup-content-wrapper{background:rgba(20,30,45,.95)!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:10px!important;color:rgba(255,255,255,.9)!important;box-shadow:var(--shadow-md)!important;}
.leaflet-popup-tip{background:rgba(20,30,45,.95)!important;}
.leaflet-popup-content{margin:12px 16px!important;font-size:12px;line-height:1.6;}
.leaflet-popup-content b{color:#fff;}
.leaflet-popup-close-button{color:rgba(255,255,255,.5)!important;top:4px!important;right:6px!important;}
.leaflet-control-attribution{background:rgba(20,30,45,.7)!important;color:rgba(255,255,255,.35)!important;font-size:9px!important;border-radius:4px 0 0 0!important;}
.leaflet-control-attribution a{color:rgba(255,255,255,.35)!important;}
.leaflet-bar a{background:rgba(20,30,45,.9)!important;color:rgba(255,255,255,.85)!important;border-color:rgba(255,255,255,.1)!important;}
.leaflet-bar a:hover{background:rgba(40,55,75,.95)!important;}
.leaflet-control-layers{background:rgba(20,30,45,.92)!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:8px!important;}
.leaflet-control-layers-base label{color:rgba(255,255,255,.8)!important;font-size:12px!important;}

/* ═══════════════════════════════════════
   MOBILE  — full map-first experience
   ═══════════════════════════════════════ */
@media(max-width:768px){
  body{overflow:hidden;height:100dvh;}

  /* Compact nav: two rows */
  nav{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px;}
  .audubon-logo{height:24px;}
  .bird-thumb{width:28px;height:28px;}
  .nav-sep{display:none;}
  .nav-title-wrap{display:none;}
  .nav-controls{margin-left:0;width:100%;gap:5px;}
  .date-lbl{display:none;}
  .date-in{flex:1;min-width:0;font-size:12px;padding:6px 8px;}
  .nav-status{display:none;}

  /* Main stacks vertically */
  .main{flex-direction:column;overflow:hidden;}

  /* ── BIRD LIST — horizontal strip, always visible ── */
  .sidebar{
    width:100%;
    height:auto;
    flex-shrink:0;
    border-right:none;
    border-bottom:1px solid var(--border);
  }
  .sidebar-top{padding:10px 12px 8px;}
  .s-heading{font-size:14px;}
  .bird-list{
    display:flex;
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
    padding:6px 8px;
    gap:8px;
    background:var(--off-white);
    flex:none;
  }
  .bird-card{
    min-width:180px;
    flex-shrink:0;
    margin-bottom:0;
  }

  /* ── MAP — fills remaining space ── */
  .map-wrap{
    flex:1;
    min-height:0;
    position:relative;
  }
  #map{
    position:absolute;
    inset:0;
    height:100%!important;
  }

  /* ── STATS — floating bottom sheet over map ── */
  .stats-panel{
    position:absolute;
    bottom:0;left:0;right:0;
    z-index:600;
    border-radius:14px 14px 0 0;
    border-top:2px solid var(--blue);
    max-height:55%;
    overflow-y:auto;
    transform:translateY(calc(100% - 44px)); /* collapsed: show handle only */
    transition:transform .3s ease;
  }
  .stats-panel.expanded{transform:translateY(0);}

  /* Drag handle */
  .stats-panel::before{
    content:'';
    display:block;
    width:36px;height:4px;
    background:var(--border);
    border-radius:2px;
    margin:10px auto 6px;
    cursor:pointer;
    flex-shrink:0;
  }

  .stats-empty{padding:2px 16px 12px;font-size:12px;}
  .stats-head{padding:4px 16px 8px;}
  .stats-name{font-size:12px;}

  /* Stack stat cells vertically on mobile */
  .stats-grid{flex-direction:column;}
  .sc{border-right:none;border-bottom:1px solid var(--border);min-width:unset;display:flex;align-items:center;justify-content:space-between;padding:9px 16px;}
  .sc:last-child{border-bottom:none;}
  .sv{font-size:20px;}

  .map-legend{display:none;}
  .loading-ov{z-index:700;}
}

@media(max-width:400px){
  .bird-thumb{display:none;}
  .bird-card{min-width:160px;}
}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>

/* DATES */
function initDates(){
  const now=new Date(), past=new Date(now-24*3600*1000);

/* INIT */
function init(){
  initDates();
  map=L.map('map',{zoomControl:true}).setView([3.19,-76.54],11);

  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19});
  const lbl=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
  const topo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19});
  const dark=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:16});

  L.layerGroup([sat,lbl]).addTo(map);
  L.control.layers({'🛰 Satellite+Labels':L.layerGroup([sat,lbl]),'🌑 Dark':dark,'🗺 Topo':topo},{},{position:'bottomleft'}).addTo(map);

  trackLayer=L.layerGroup().addTo(map);
  markerLayer=L.layerGroup().addTo(map);

  // Fix map size after layout settles
  setTimeout(()=>map.invalidateSize(),200);
  window.addEventListener('resize',()=>map.invalidateSize());

  checkBackend();
  setInterval(checkBackend,30000);
  renderSidebar();
}

/* STATS PANEL — tap to expand/collapse on mobile */
function handleStatsTap(e){
  if(!isMobile()) return;
  const panel=document.getElementById('statsPanel');
  // Only toggle on handle area (top 44px)
  const rect=panel.getBoundingClientRect();
  if(e.clientY-rect.top<44){
    panel.classList.toggle('expanded');
  }
}

function expandStats(){
  if(isMobile()){
    setTimeout(()=>document.getElementById('statsPanel').classList.add('expanded'),100);
  }
}

function collapseStats(){
  document.getElementById('statsPanel').classList.remove('expanded');
}

/* GEOCODE */
const ISO2_TO_3={AF:'AFG',AL:'ALB',DZ:'DZA',AD:'AND',AO:'AGO',AG:'ATG',AR:'ARG',AM:'ARM',AU:'AUS',AT:'AUT',AZ:'AZE',BS:'BHS',BH:'BHR',BD:'BGD',BB:'BRB',BY:'BLR',BE:'BEL',BZ:'BLZ',BJ:'BEN',BT:'BTN',BO:'BOL',BA:'BIH',BW:'BWA',BR:'BRA',BN:'BRN',BG:'BGR',BF:'BFA',BI:'BDI',CV:'CPV',KH:'KHM',CM:'CMR',CA:'CAN',CF:'CAF',TD:'TCD',CL:'CHL',CN:'CHN',CO:'COL',KM:'COM',CG:'COG',CD:'COD',CR:'CRI',HR:'HRV',CU:'CUB',CY:'CYP',CZ:'CZE',DK:'DNK',DJ:'DJI',DM:'DMA',DO:'DOM',EC:'ECU',EG:'EGY',SV:'SLV',GQ:'GNQ',ER:'ERI',EE:'EST',SZ:'SWZ',ET:'ETH',FJ:'FJI',FI:'FIN',FR:'FRA',GA:'GAB',GM:'GMB',GE:'GEO',DE:'DEU',GH:'GHA',GR:'GRC',GD:'GRD',GT:'GTM',GN:'GIN',GW:'GNB',GY:'GUY',HT:'HTI',HN:'HND',HU:'HUN',IS:'ISL',IN:'IND',ID:'IDN',IR:'IRN',IQ:'IRQ',IE:'IRL',IL:'ISR',IT:'ITA',JM:'JAM',JP:'JPN',JO:'JOR',KZ:'KAZ',KE:'KEN',KI:'KIR',KP:'PRK',KR:'KOR',KW:'KWT',KG:'KGZ',LA:'LAO',LV:'LVA',LB:'LBN',LS:'LSO',LR:'LBR',LY:'LBY',LI:'LIE',LT:'LTU',LU:'LUX',MG:'MDG',MW:'MWI',MY:'MYS',MV:'MDV',ML:'MLI',MT:'MLT',MH:'MHL',MR:'MRT',MU:'MUS',MX:'MEX',FM:'FSM',MD:'MDA',MC:'MCO',MN:'MNG',ME:'MNE',MA:'MAR',MZ:'MOZ',MM:'MMR',NA:'NAM',NR:'NRU',NP:'NPL',NL:'NLD',NZ:'NZL',NI:'NIC',NE:'NER',NG:'NGA',NO:'NOR',OM:'OMN',PK:'PAK',PW:'PLW',PA:'PAN',PG:'PNG',PY:'PRY',PE:'PER',PH:'PHL',PL:'POL',PT:'PRT',QA:'QAT',RO:'ROU',RU:'RUS',RW:'RWA',KN:'KNA',LC:'LCA',VC:'VCT',WS:'WSM',SM:'SMR',ST:'STP',SA:'SAU',SN:'SEN',RS:'SRB',SC:'SYC',SL:'SLE',SG:'SGP',SK:'SVK',SI:'SVN',SB:'SLB',SO:'SOM',ZA:'ZAF',SS:'SSD',ES:'ESP',LK:'LKA',SD:'SDN',SR:'SUR',SE:'SWE',CH:'CHE',SY:'SYR',TW:'TWN',TJ:'TJK',TZ:'TZA',TH:'THA',TL:'TLS',TG:'TGO',TO:'TON',TT:'TTO',TN:'TUN',TR:'TUR',TM:'TKM',TV:'TUV',UG:'UGA',UA:'UKR',AE:'ARE',GB:'GBR',US:'USA',UY:'URY',UZ:'UZB',VU:'VUT',VE:'VEN',VN:'VNM',YE:'YEM',ZM:'ZMB',ZW:'ZWE'};

async function reverseGeocode(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=8`,{headers:{'Accept-Language':'en'}});
    const d=await r.json(); const a=d.address||{};
    if(d.type==='sea'||d.type==='ocean'||a.body_of_water) return d.name||a.body_of_water||'Open Ocean';
    const adm2=a.county||a.municipality||a.city_district||a.state_district;
    const adm1=a.state||a.region;
    const cc2=a.country_code?.toUpperCase();
    const cc3=cc2?ISO2_TO_3[cc2]||cc2:null;
    if(adm2&&adm1&&cc3) return `${adm2}, ${adm1} (${cc3})`;
    if(adm2&&adm1) return `${adm2}, ${adm1}`;
    if(adm2&&cc3) return `${adm2} (${cc3})`;
    if(adm1&&cc3) return `${adm1} (${cc3})`;
    return d.display_name?.split(',').slice(0,2).join(',').trim()||'—';
  }catch(e){return '—';}
}

/* SIDEBAR */

    const lastStr=last?fmtDateTime(last.dt):'—';
    const place=birdLocation[bird.deviceUid]||(has?'Locating…':'—');
    const active=activeBird?.deviceUid===bird.deviceUid;
    const card=document.createElement('div');
    card.className='bird-card'+(active?' active':'')+(has?'':' no-data');
    card.style.setProperty('--bird-color',bird.color);
    card.innerHTML=`

/* SELECT */
function selectBird(bird){
  if(typeof trackBirdSelect==='function') trackBirdSelect(bird.name);
  activeBird=bird;
  trackLayer.clearLayers(); markerLayer.clearLayers();
  renderSidebar();
  drawTrack(bird);
  renderStats(bird);
  expandStats();
  map.invalidateSize();
}

/* DRAW TRACK */
function drawTrack(bird){
  const pts=(birdData[bird.deviceUid]||[]).filter(p=>p.lat&&p.lon).sort((a,b)=>a.dt.localeCompare(b.dt));
  if(!pts.length) return;
  L.polyline(pts.map(p=>[p.lat,p.lon]),{color:bird.color,weight:2,opacity:.65,dashArray:'5 8'}).addTo(trackLayer);
  pts.forEach((pt,i)=>{
    const isLast=i===pts.length-1;
    const col=classColor(pt.cls);
    const m=L.circleMarker([pt.lat,pt.lon],{
      radius:isLast?10:6, fillColor:col,
      color:isLast?'#fff':bird.color, weight:isLast?2.5:1, fillOpacity:isLast?1:.8
    }).addTo(markerLayer);
    m.bindTooltip(`<b>${pt.dt.replace('T',' ').slice(0,16)} UTC</b><br>${pt.lat.toFixed(5)}°N ${Math.abs(pt.lon).toFixed(5)}°W<br>Alt: <b>${pt.alt}m</b> · ±${pt.err}m · Class ${pt.cls}<br>Sat: ${pt.sat}`,{direction:'top',offset:[0,-5]});
    m.on('click',()=>L.popup().setLatLng([pt.lat,pt.lon]).setContent(`<b style="font-size:13px">${bird.name}</b><br><span style="color:rgba(255,255,255,.5)">${pt.dt.replace('T',' ').slice(0,16)} UTC</span><br><br><b>${pt.lat.toFixed(5)}°N · ${Math.abs(pt.lon).toFixed(5)}°W</b><br>Altitude: ${pt.alt}m<br>Class ${pt.cls} ±${pt.err}m<br>Sat: ${pt.sat}`).openOn(map));
  });
  map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])).pad(.2));
}

function classColor(c){
  if(['A','1','2','3'].includes(String(c))) return '#4ade80';
  if(c==='B') return '#fbbf24'; return '#94a3b8';
}

/* STATS */
function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bearing(a,b,c,d){const dl=(d-b)*Math.PI/180,y=Math.sin(dl)*Math.cos(c*Math.PI/180),x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function bearingLbl(d){return['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];}

function renderStats(bird){
  const pts=(birdData[bird.deviceUid]||[]).sort((a,b)=>a.dt.localeCompare(b.dt));
  document.getElementById('statsEmpty').style.display='none';
  const sc=document.getElementById('statsContent'); sc.classList.add('on');
  document.getElementById('statsBirdName').textContent=`${bird.name} · ${bird.deviceRef}`;
  if(pts.length<2){
    document.getElementById('statsPeriod').textContent='Insufficient data';
    document.getElementById('statsGrid').innerHTML='<div class="sc" style="color:var(--muted);font-style:italic">Not enough fixes.</div>';
    return;
  }
  const f=pts[0],l=pts[pts.length-1];
  const durH=(new Date(l.dt+'Z')-new Date(f.dt+'Z'))/3600000;
  const durStr=durH<24?`${Math.floor(durH)}h ${Math.round((durH%1)*60)}m`:`${(durH/24).toFixed(1)} days`;
  let cum=0; for(let i=1;i<pts.length;i++) cum+=haversine(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
  const str=haversine(f.lat,f.lon,l.lat,l.lon);
  const spd=durH>0?cum/durH:0;
  const deg=bearing(f.lat,f.lon,l.lat,l.lon);
  document.getElementById('statsPeriod').textContent=`${fmtDate(f.dt)} → ${fmtDate(l.dt)}`;
  document.getElementById('statsGrid').innerHTML=`
    <div class="sc"><div class="sk">Duration</div><div><div class="sv">${durStr}</div><div class="ss">${pts.length} fixes</div></div></div>
    <div class="sc"><div class="sk">Path Distance</div><div><div class="sv">${cum.toFixed(1)}<span class="su">km</span></div><div class="ss">Cumulative along track</div></div></div>
    <div class="sc"><div class="sk">Displacement</div><div><div class="sv">${str.toFixed(1)}<span class="su">km</span></div><div class="ss">Start → latest fix</div></div></div>
    <div class="sc"><div class="sk">Avg Speed</div><div><div class="sv">${spd.toFixed(1)}<span class="su">km/h</span></div><div class="ss">${(spd*.621371).toFixed(1)} mph</div></div></div>
    <div class="sc"><div class="sk">Direction</div><div><div class="sv">${bearingLbl(deg)}</div><div class="ss">${deg.toFixed(0)}° bearing</div></div></div>`;
}

/* LOAD */
async function loadAllBirds(){
  const from=document.getElementById('dateFrom').value+'T00:00:00.000Z';
  const to=document.getElementById('dateTo').value+'T23:59:59.000Z';
  if(typeof trackLoadData==='function') trackLoadData(from,to);
  setLoading(true,'Fetching tracks…');
  document.getElementById('btnLoad').classList.add('loading');
  try{
    const res=await fetch(`${API_BASE}/api/tracks?from=${from}&to=${to}`);
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Load failed');
    let loaded=0;
    for(const t of(data.devices||[])){ if(t.points?.length){birdData[t.deviceUid]=t.points;loaded++;} }
    toast(`Loaded ${loaded} of ${BIRDS.length} birds`);
    setLoading(true,'Identifying locations…');
    await geocodeAll();
  }catch(e){toast('Error: '+e.message);console.error(e);}
  setLoading(false);
  document.getElementById('btnLoad').classList.remove('loading');
  renderSidebar();
  const first=BIRDS.find(b=>(birdData[b.deviceUid]||[]).length>0);
  if(first) selectBird(first);
}

async function geocodeAll(){
  for(const bird of BIRDS){
    const pts=birdData[bird.deviceUid];
    if(!pts?.length) continue;
    const last=[...pts].sort((a,b)=>b.dt.localeCompare(a.dt))[0];
    birdLocation[bird.deviceUid]=await reverseGeocode(last.lat,last.lon);
    renderSidebar();
  }
}

/* BACKEND */
async function checkBackend(){
  try{
    const d=await(await fetch(`${API_BASE}/health`)).json();
    const dot=document.getElementById('statusDot'),txt=document.getElementById('statusText');
    if(d.status==='ok'&&d.tokenValid){dot.className='sdot ok';txt.textContent=`Connected · ${d.tokenExpiresIn}s`;}
    else{dot.className='sdot warn';txt.textContent='Refreshing…';}
  }catch(e){document.getElementById('statusDot').className='sdot err';document.getElementById('statusText').textContent='Backend offline';}
}

function fmtDate(dt){return new Date(dt+(dt.endsWith('Z')?'':'Z')).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDateTime(dt){
  const d=new Date(dt+(dt.endsWith('Z')?'':'Z'));
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+
    d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'UTC',hour12:false})+' UTC';
}
function setLoading(v,msg=''){document.getElementById('loadingOverlay').classList.toggle('visible',v);if(msg)document.getElementById('loadingText').textContent=msg;}
let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3500);}

init();
checkBackend();
setInterval(checkBackend,30000);
</script>
